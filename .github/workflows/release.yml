name: Build and Release

on:
  push:
    branches:
      - seismic
      - feature/**

jobs:
  build-and-release:
    name: Build and Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        arch: [x86_64, arm64]

    steps:
      # Step 1: Check out the source code
      - name: Checkout source code
        uses: actions/checkout@v3

      # Step 2: Set up dependencies
      - name: Set up dependencies
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt-get install -y build-essential cmake python3 python3-pip zlib1g-dev libboost-all-dev libssl-dev
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            brew install cmake boost openssl

      # Step 3: Initialize Git submodules
      - name: Update Git submodules
        run: git submodule update --init --recursive

      # Step 4: Build binaries
      - name: Build Seismic Solidity
        run: |
          mkdir build
          cd build
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DUSE_Z3=OFF -DPEDANTIC=OFF
          else
            cmake .. -DCMAKE_BUILD_TYPE=Release -DUSE_Z3=OFF -DPEDANTIC=OFF
          fi
          make -j$(nproc || sysctl -n hw.logicalcpu)

      # Step 5: Package binaries
      - name: Archive binary
        run: |
          cd build
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            tar -czvf seismic-solc-macos-${{ matrix.arch }}.tar.gz solc
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            tar -czvf seismic-solc-linux-${{ matrix.arch }}.tar.gz solc

      # Step 6: Create a release in seismic-solidity-releases
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        with:
          repository: your-org/seismic-solidity-releases
          tag_name: ${{ github.sha }}
          release_name: "Release for ${{ github.ref_name }}"
          body: "Automated release for commit ${{ github.sha }}."
          draft: false
          prerelease: false

      # Step 7: Upload binaries to the release
      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: |
            build/seismic-solc-${{ matrix.os == 'macos-latest' && 'macos' || 'linux' }}-${{ matrix.arch }}.tar.gz
          asset_name: seismic-solc-${{ matrix.os == 'macos-latest' && 'macos' || 'linux' }}-${{ matrix.arch }}.tar.gz
          asset_content_type: application/gzip
