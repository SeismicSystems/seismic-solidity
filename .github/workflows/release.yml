name: Build and Release

on:
  push:
    branches:
      - seismic
      - feature/**

jobs:
  build-and-release:
    name: Build and Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-13]
        arch: [x86_64, arm64]
        exclude:
          - os: macos-latest
            arch: x86_64
          - os: macos-13
            arch: arm64

    steps:
      # Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      # Set up dependencies
      - name: Set up dependencies (Linux & macOS)
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential python3 python3-pip \
              zlib1g-dev libboost-all-dev libssl-dev ccache
          elif [[ "${{ matrix.os }}" == "macos-latest" || "${{ matrix.os }}" == "macos-13" ]]; then
            brew update
            brew install boost openssl ccache
          fi

      - name: Set up dependencies (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          # Install Chocolatey for package management
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))

          # Install required tools
          choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System'
          choco install -y visualstudio2019buildtools --package-parameters `
            "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --includeOptional"
          choco install -y python

          # Download and build Boost
          Invoke-WebRequest -Uri https://boostorg.jfrog.io/artifactory/main/release/1.82.0/source/boost_1_82_0.zip -OutFile boost.zip
          Expand-Archive boost.zip -DestinationPath C:\boost
          cd C:\boost\boost_1_82_0
          ./bootstrap.bat
          ./b2 install --prefix=C:\boost\boost-install --build-type=complete toolset=msvc link=static runtime-link=static address-model=64 architecture=x86

      # Build Seismic Solidity
      - name: Build Seismic Solidity
        shell: bash
        run: |
          mkdir build
          cd build
          if [[ "${{ matrix.os }}" == "macos-latest" || "${{ matrix.os }}" == "macos-13" ]]; then
            cmake .. -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
              -DUSE_Z3=OFF -DPEDANTIC=OFF
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            cmake .. -G "Visual Studio 16 2019" -A ${{ matrix.arch == 'x86_64' && 'x64' || 'ARM64' }} \
              -DCMAKE_BUILD_TYPE=Release \
              -DUSE_Z3=OFF -DPEDANTIC=OFF \
              -DBoost_DIR=C:/boost/boost-install/lib/cmake/Boost \
              -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          else
            cmake .. -DCMAKE_BUILD_TYPE=Release \
              -DUSE_Z3=OFF -DPEDANTIC=OFF
          fi
          cmake --build . --config Release -j 2

      # Archive binary
      - name: Archive binary
        shell: bash
        run: |
          cd build
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            tar -czvf seismic-solc-macos-arm64.tar.gz solc/solc
          elif [ "${{ matrix.os }}" = "macos-13" ]; then
            tar -czvf seismic-solc-macos-x86_64.tar.gz solc/solc
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            tar -czvf "seismic-solc-linux-${{ matrix.arch }}.tar.gz" solc/solc
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            Compress-Archive -Path solc/Release/solc.exe -DestinationPath "seismic-solc-windows-${{ matrix.arch }}.zip"
          fi

      # Upload artifacts
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: build/*

  release:
    name: Create Release
    needs: build-and-release
    runs-on: ubuntu-latest

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/

      - name: Install GitHub CLI
        run: sudo apt-get install -y gh

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.RELEASES_TOKEN }}" | gh auth login --with-token

      - name: Create Single Release
        run: |
          cd artifacts/
          gh release create ${{ github.sha }} \
            --repo SeismicSystems/seismic-solidity-releases \
            --title "Release for ${{ github.ref_name }}" \
            --notes "Automated release for commit ${{ github.sha }}." \
            binaries-*.*
