name: Build and Release

on:
  push:
    branches:
      - seismic
      - feature/**

jobs:
  build-and-release:
    name: Build and Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-13]
        arch: [x86_64, arm64]
        exclude:
          - os: macos-latest
            arch: x86_64
          - os: macos-13
            arch: arm64

    steps:
      # Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      # Setup CMake
      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.21.3"

      # Set up dependencies
      - name: Set up dependencies
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential python3 python3-pip \
              zlib1g-dev libboost-all-dev libssl-dev ccache
          elif [ "${{ matrix.os }}" = "macos-latest" ] || [ "${{ matrix.os }}" = "macos-13" ]; then
            brew update
            brew install boost openssl ccache
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            git clone https://github.com/Microsoft/vcpkg.git
            cd vcpkg
            ./bootstrap-vcpkg.bat
            ./vcpkg install boost --triplet ${{ matrix.arch == 'x86_64' && 'x64-windows' || 'arm64-windows' }}
            ./vcpkg install zlib --triplet ${{ matrix.arch == 'x86_64' && 'x64-windows' || 'arm64-windows' }}
            ./vcpkg install openssl --triplet ${{ matrix.arch == 'x86_64' && 'x64-windows' || 'arm64-windows' }}
          fi

      # Build Seismic Solidity
      - name: Build Seismic Solidity
        shell: bash
        run: |
          mkdir build
          cd build
          if [[ "${{ matrix.os }}" == "macos-latest" || "${{ matrix.os }}" == "macos-13" ]]; then
            cmake .. -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
              -DUSE_Z3=OFF -DPEDANTIC=OFF
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            cmake .. -G "Visual Studio 17 2022" -A ${{ matrix.arch == 'x86_64' && 'x64' || 'ARM64' }} \
              -DCMAKE_BUILD_TYPE=Release \
              -DUSE_Z3=OFF -DPEDANTIC=OFF \
              -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake
          else
            cmake .. -DCMAKE_BUILD_TYPE=Release \
              -DUSE_Z3=OFF -DPEDANTIC=OFF
          fi
          cmake --build . --config Release -j 2

      # Archive binary
      - name: Archive binary
        shell: bash
        run: |
          cd build
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            tar -czvf seismic-solc-macos-arm64.tar.gz solc/solc
          elif [ "${{ matrix.os }}" = "macos-13" ]; then
            tar -czvf seismic-solc-macos-x86_64.tar.gz solc/solc
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            tar -czvf "seismic-solc-linux-${{ matrix.arch }}.tar.gz" solc/solc
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "seismic-solc-windows-${{ matrix.arch }}.zip" "solc/Release/solc.exe"
          fi

      # Upload artifacts
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: build/*

  release:
    name: Create Release
    needs: build-and-release
    runs-on: ubuntu-latest

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/

      - name: Install GitHub CLI
        run: sudo apt-get install -y gh

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.RELEASES_TOKEN }}" | gh auth login --with-token

      - name: Create Single Release
        run: |
          cd artifacts/
          gh release create ${{ github.sha }} \
            --repo SeismicSystems/seismic-solidity-releases \
            --title "Release for ${{ github.ref_name }}" \
            --notes "Automated release for commit ${{ github.sha }}." \
            binaries-*.*

