name: Build and Release

on:
  push:
    branches:
      - seismic
      - feature/**

jobs:
  build-and-release:
    name: Build and Release Binaries
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        arch: [x86_64, arm64]

    runs-on: ${{ matrix.os }}

    steps:
      # Step 1: Check out the source code
      - name: Checkout source code
        uses: actions/checkout@v3

      # Step 2: Set up dependencies
      - name: Set up dependencies
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt-get install -y build-essential cmake python3 python3-pip zlib1g-dev libboost-all-dev libssl-dev ccache
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            brew install cmake boost openssl ccache
          fi
          # Set up ccache for faster rebuilds
          export CCACHE_DIR=/tmp/.ccache
          ccache --max-size=5G

      # Step 3: Initialize Git submodules
      - name: Update Git submodules
        run: git submodule update --init --recursive

      # Step 4: Build binaries
      - name: Build Seismic Solidity
        run: |
          mkdir build
          cd build
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DUSE_Z3=OFF -DPEDANTIC=OFF \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          else
            cmake .. -DCMAKE_BUILD_TYPE=Release -DUSE_Z3=OFF -DPEDANTIC=OFF \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          fi
          # Limit parallelism to avoid resource issues
          make -j2

      # Step 5: Package binaries
      - name: Archive binary
        run: |
          cd build
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            tar -czvf seismic-solc-macos-${{ matrix.arch }}.tar.gz solc
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            tar -czvf seismic-solc-linux-${{ matrix.arch }}.tar.gz solc

      # Step 6: Install GitHub CLI (gh)
      - name: Install GitHub CLI
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get install -y gh
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            brew install gh
          fi
          gh --version

      # Step 7: Authenticate GitHub CLI
      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.RELEASES_TOKEN }}" | gh auth login --with-token

      # Step 8: Create a release in seismic-solidity-releases
      - name: Create Release
        run: |
          gh release create ${{ github.sha }} \
          --repo your-org/seismic-solidity-releases \
          --title "Release for ${{ github.ref_name }}" \
          --notes "Automated release for commit ${{ github.sha }}" \
          build/seismic-solc-macos-${{ matrix.arch }}.tar.gz \
          build/seismic-solc-linux-${{ matrix.arch }}.tar.gz
