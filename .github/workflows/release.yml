name: Release

on:
  push:
    branches:
      - seismic

jobs:
  build-release:
    name: Build and Archive Binaries
    runs-on: ${{ matrix.os == 'ubuntu-22.04' && 'ssolc-ubuntu-22.04' || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, windows-latest, macos-latest, macos-13]
        arch: [x86_64, arm64]
        exclude:
          - os: macos-latest
            arch: x86_64
          - os: macos-13
            arch: arm64

    steps:
      # Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Set up dependencies
      - name: Set up dependencies (Linux & macOS)
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        # NOTE: on the self-runner machine (ubuntu-22.04),
        #       these dependencies are already installed
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt-get install -y build-essential python3 python3-pip \
              zlib1g-dev libboost-all-dev libssl-dev ccache
          elif [[ "${{ matrix.os }}" == "macos-latest" || "${{ matrix.os }}" == "macos-13" ]]; then
            brew update
            brew install boost openssl ccache
          fi

      - name: Set up dependencies (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: powershell
        run: |
          .\scripts\install_deps.ps1

      - name: Build Seismic Solidity on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        shell: powershell
        run: |
          .\.circleci\build_win.ps1

      # Build Seismic Solidity
      - name: Build Seismic Solidity on Linux & macOS
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          mkdir build
          cd build
          if [[ "${{ matrix.os }}" == "macos-latest" || "${{ matrix.os }}" == "macos-13" ]]; then
            cmake .. -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
              -DUSE_Z3=OFF -DPEDANTIC=OFF
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" || "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            cmake .. -DCMAKE_BUILD_TYPE=Release \
              -DUSE_Z3=OFF -DPEDANTIC=OFF
          fi
          cmake --build . --config Release -j $(nproc)

      # Archive binary
      - name: Archive binary (Linux & macOS)
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          cd build
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            tar -czvf ssolc-macos-arm64.tar.gz solc/solc
          elif [ "${{ matrix.os }}" = "macos-13" ]; then
            tar -czvf ssolc-macos-x86_64.tar.gz solc/solc
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            tar -czvf ssolc-linux-${{ matrix.arch }}.tar.gz solc/solc
          elif [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            tar -czvf ssolc-${{ matrix.os }}-${{ matrix.arch }}.tar.gz solc/solc
          fi

      - name: Archive binary (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: powershell
        run: |
          cd build
          Compress-Archive -Path solc/Release/solc.exe -DestinationPath ssolc-windows-${{ matrix.arch }}.zip

      # Upload artifacts
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: build/*ssolc-*

  publish-release:
    name: Create Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd artifacts/

          # Move all archives to a flat directory structure
          mkdir -p release_files
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release_files/ \;

          cd release_files

          # Check if files were found
          ARCHIVES=$(ls *.tar.gz *.zip 2>/dev/null || echo "")
          if [ -z "$ARCHIVES" ]; then
            echo "Error: No archive files found in release_files directory!"
            exit 1
          fi

          echo "Found archive files:"
          ls -la

          # Use shortened SHA directly for tag and title
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "Using shortened SHA: $SHORT_SHA"

          # Create release first
          gh release create "$SHORT_SHA" \
            --title "Release for $SHORT_SHA" \
            --notes "Automated release for commit ${{ github.sha }}."

          # Then upload each asset separately
          shopt -s nullglob
          for file in *.tar.gz *.zip; do
            echo "Uploading $file..."
            gh release upload "$SHORT_SHA" "$file" --clobber
          done
          shopt -u nullglob
